services:
  requestarr:
    image: ghcr.io/spongebobmoviept-lab/requestarr:1.1.0   # ready-made image (amd64 + arm64)
    # build: https://github.com/spongebobmoviept-lab/Requestarr.git#v1.1.0   # to build from source instead: uncomment, then `docker compose up -d --build`
    container_name: requestarr
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - path: .env
        required: false  # optional; copy .env.example to .env to customise
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
